<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>最小资料授权</title><link rel="stylesheet" href="sample-ui.css"><script src="autumn-sdk.js" defer></script><script src="sample-ui.js" defer></script><script src="identity.js" defer></script></head><body><main><header><p class="eyebrow">AUTUMNOS / IDENTITY APP</p><h1>资料由你决定分享</h1><p>先在 AutumnOS 账号页完成真实登录，再由本应用单独申请资料。游客返回 AUTH_REQUIRED，不创建模拟资料。</p></header><section class="panel"><p id="capabilities"></p><p id="lifecycle"></p><p id="appearance"></p><div class="actions"><button id="query" data-host disabled>查询授权状态</button><button id="request-profile" data-host disabled>申请并读取最小资料</button><button id="read-profile" data-host disabled>读取已授权资料</button><button id="stop-waiting">停止本页等待</button></div><pre id="profile">尚未读取资料。</pre><p id="permission-state"></p></section><section class="panel"><h2>拒绝、撤销与账号变化</h2><p>在宿主弹窗拒绝或取消，不会重复弹窗。已拒绝/撤销的权限请在设置→应用权限与数据管理。撤销后本样例清空当前显示；宿主不能收回其他应用已复制的资料。</p><p>“停止本页等待”不会取消已显示的宿主授权弹窗。账号切换结束旧实例，重新打开后再授权；不会将 appScopedUserId 或昵称当作服务器凭证。</p></section><p id="status" role="status" aria-live="polite"></p><footer>制作人：派蒙 · 不显示令牌，不请求远程头像，不记录资料日志。</footer></main></body></html>
