<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>桌面扩展</title><link rel="stylesheet" href="sample-ui.css"><script src="autumn-sdk.js" defer></script><script src="sample-ui.js" defer></script><script src="desktop.js" defer></script></head><body><main><header><p class="eyebrow">AUTUMNOS / DESKTOP EXTENSION</p><h1>让应用和桌面相连</h1><p>所有操作使用当前实例的已声明动作。先申请权限，再点击具体操作。</p></header><section class="panel"><p id="capabilities"></p><p id="lifecycle"></p><p id="appearance"></p><label for="note">小组件文字（不持久保存）</label><input id="note" maxlength="120" value="今天发现了一点新知识"><div class="actions"><button id="permit-notifications" data-host disabled>申请通知权限</button><button id="notify" data-host disabled>发通知</button><button id="repeat-notify" data-host disabled>重复上一条通知</button><button id="badge" data-host disabled>设置角标 1</button><button id="clear-badge" data-host disabled>清除角标</button></div><div class="actions"><button id="permit-shortcuts" data-host disabled>申请快捷操作权限</button><button id="register" data-host disabled>登记长按操作</button><button id="unregister" data-host disabled>撤下长按操作</button><button id="permit-widgets" data-host disabled>申请小组件权限</button><button id="widget" data-host disabled>更新纯文本小组件</button></div><div class="actions"><button id="permit-links" data-host disabled>申请内部链接权限</button><button id="link" data-host disabled>投递 focus 动作</button></div><p id="events" aria-live="polite">等待真实宿主事件。</p></section><p>返回桌面后查看图标角标、长按菜单、小组件和通知中心。切换宿主主题后继续应用。关闭本实例会清理这些临时扩展；不会执行命令、外部 URI 或创建新游戏。</p><p id="status" role="status" aria-live="polite"></p><footer>制作人：派蒙 · HTML/脚本不能进入小组件内容。</footer></main></body></html>
