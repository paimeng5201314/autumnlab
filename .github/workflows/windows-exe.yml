name: Build Windows EXE

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: Internal build version
        default: 0.5.1-local.5
        required: true
      release_label:
        description: Version displayed in the application
        default: meta0.0.2-20261007
        required: true
  push:
    branches:
      - 'codex/windows-exe-*'

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      AUTUMN_BUILD_ID: T06-actions-${{ github.run_id }}-${{ github.run_attempt }}
      AUTUMN_BUILD_VERSION: ${{ inputs.build_version || '0.5.1-local.5' }}
      AUTUMN_RELEASE_LABEL: ${{ inputs.release_label || 'meta0.0.2-20261007' }}
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      POWERSHELL_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Check out the exact build source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24.19.0

      - name: Prepare the pinned local SDK and PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setupDirectory = "artifacts/actions-setup/$env:AUTUMN_BUILD_ID"
          New-Item -ItemType Directory -Force $setupDirectory | Out-Null
          Start-Transcript -LiteralPath "$setupDirectory/setup.log" | Out-Null
          try {
            ./scripts/Install-LocalSdk.ps1
            New-Item -ItemType Directory -Force .tools/nuget-feed | Out-Null
            $env:DOTNET_ROOT = Join-Path $PWD '.tools/dotnet'
            $env:DOTNET_CLI_HOME = Join-Path $PWD '.tools/dotnet-home'
            $env:NUGET_PACKAGES = Join-Path $PWD '.tools/nuget/packages'
            $env:PATH = $env:DOTNET_ROOT + [IO.Path]::PathSeparator + $env:PATH
            $toolOutput = & ./.tools/dotnet/dotnet.exe tool install PowerShell --version 7.6.6 --tool-path .tools/pwsh-ci --configfile NuGet.Config 2>&1
            $toolExit = $LASTEXITCODE
            $toolOutput | Out-Host
            if ($toolExit -ne 0) { throw ('Pinned PowerShell installation failed: ' + ($toolOutput -join ' ')) }
          } catch {
            $failure = $_.Exception.Message
            $safeAnnotation = $failure.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Toolchain preparation failed::$safeAnnotation"
            "Toolchain preparation failed: $failure" | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
            throw
          } finally { Stop-Transcript | Out-Null }

      - name: Build, test and package the single EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $env:DOTNET_ROOT = Join-Path $PWD '.tools/dotnet'
          $env:PATH = $env:DOTNET_ROOT + [IO.Path]::PathSeparator + $env:PATH
          $launchLog = "artifacts/actions-setup/$env:AUTUMN_BUILD_ID/pipeline-launch.log"
          try {
            & ./.tools/pwsh-ci/pwsh.exe -NoLogo -NoProfile -NonInteractive -File ./scripts/Build-SingleFile.ps1 -BuildId $env:AUTUMN_BUILD_ID -BuildVersion $env:AUTUMN_BUILD_VERSION -ReleaseLabel $env:AUTUMN_RELEASE_LABEL -SkipNativeSmoke 2>&1 | Tee-Object -FilePath $launchLog
            $pipelineExit = $LASTEXITCODE
          } catch {
            $safeLaunchFailure = $_.Exception.Message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Pipeline launch failed::$safeLaunchFailure"
            throw
          }
          if ($pipelineExit -ne 0) {
            Get-Content -LiteralPath $launchLog -Tail 20 | ForEach-Object {
              $line = $_.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              if ($line.Trim()) { Write-Host "::error title=Pipeline startup or failure diagnostic::$line" }
            }
            $reportPath = "artifacts/build-pipelines/$env:AUTUMN_BUILD_ID/pipeline.json"
            if (Test-Path -LiteralPath $reportPath) {
              $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
              $failure = [string]$report.failure
              if ($failure) {
                $safeFailure = $failure.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Host "::error title=EXE pipeline failed::$safeFailure"
              }
            }
            $buildDirectory = "artifacts/builds/$env:AUTUMN_BUILD_ID"
            if (Test-Path -LiteralPath $buildDirectory) {
              Get-ChildItem -LiteralPath $buildDirectory -Recurse -File -Filter *.log |
                Select-String -Pattern '^FAIL |: error | error [A-Z]+[0-9]+:' |
                Select-Object -First 20 | ForEach-Object {
                  $line = $_.Line.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                  Write-Host "::error title=Build or test diagnostic::$line"
                }
            }
            throw "Windows EXE pipeline failed: $pipelineExit"
          }

      - name: Upload the EXE and its identity
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: AutumnOS-${{ env.AUTUMN_RELEASE_LABEL }}-win-x64
          path: |
            artifacts/single-file/${{ env.AUTUMN_BUILD_ID }}/AutumnOS.exe
            artifacts/builds/${{ env.AUTUMN_BUILD_ID }}/package-single-file.json
            artifacts/builds/${{ env.AUTUMN_BUILD_ID }}/source-snapshot.json
            artifacts/build-pipelines/${{ env.AUTUMN_BUILD_ID }}/pipeline.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: Windows-build-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/actions-setup/${{ env.AUTUMN_BUILD_ID }}/**/*.log
            artifacts/builds/${{ env.AUTUMN_BUILD_ID }}/**/*.json
            artifacts/builds/${{ env.AUTUMN_BUILD_ID }}/**/*.log
            artifacts/build-pipelines/${{ env.AUTUMN_BUILD_ID }}/**/*.json
            artifacts/build-pipelines/${{ env.AUTUMN_BUILD_ID }}/**/*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Record the validation boundary
        if: always()
        shell: pwsh
        run: |
          @"
          Build: $env:AUTUMN_BUILD_ID
          Source commit: $env:GITHUB_SHA
          Download the EXE from this run's Artifacts when the build job succeeds.
          Native interactive smoke tests: not_run_ci_no_interactive_desktop.
          This job does not publish a GitHub Release or sign the EXE with Authenticode.
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
